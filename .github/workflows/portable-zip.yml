name: Build Portable ZIP

on:
  push:
    branches:
      - main
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ffmpeg essentials
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpegRoot = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $ffmpegRoot) { throw "ffmpeg archive extraction failed" }
          "FFMPEG_SOURCE=$($ffmpegRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate HTTPS certs
        shell: pwsh
        run: |
          $deployCerts = Join-Path $PWD "deploy\certs"
          $runtimeCerts = Join-Path $PWD "certs"
          New-Item -ItemType Directory -Force -Path $deployCerts | Out-Null
          New-Item -ItemType Directory -Force -Path $runtimeCerts | Out-Null

          $certPem = Join-Path $deployCerts "local.pem"
          $keyPem = Join-Path $deployCerts "local-key.pem"

          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) {
            choco install openssl.light -y
            $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          }
          if (-not $openssl) { throw "openssl not available on runner" }

          & $openssl.Source req -x509 -nodes -newkey rsa:2048 `
            -keyout $keyPem `
            -out $certPem `
            -days 365 `
            -subj "/C=FR/ST=NA/L=NA/O=ML_OpenAI_WHISPER/OU=CI/CN=localhost"

          if (-not (Test-Path $certPem) -or -not (Test-Path $keyPem)) {
            throw "failed to generate deploy certs"
          }

          Copy-Item -Force $certPem (Join-Path $runtimeCerts "local.pem")
          Copy-Item -Force $keyPem (Join-Path $runtimeCerts "local-key.pem")

      - name: Build portable zip
        shell: pwsh
        run: .\deploy\package-portable.ps1 -OutputZip "dictee_courriels.zip" -FfmpegSource "$env:FFMPEG_SOURCE"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictee_courriels
          path: dictee_courriels.zip

      - name: Publish latest release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-latest
          name: Portable Latest
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: dictee_courriels.zip
