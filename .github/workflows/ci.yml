name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile application modules
        run: python -m py_compile server.py src/runtime_paths.py src/app_config.py src/update_service.py
